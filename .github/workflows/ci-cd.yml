
name: StockYard CI-CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'supermarket-inventory/**'
      - '.github/workflows/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: supermarket-inventory/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: supermarket-inventory
        run: npm ci

      - name: Build Frontend
        working-directory: supermarket-inventory
        run: npm run build

  backend-check:
    name: Backend Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: supermarket-inventory/server/package-lock.json

      - name: Install Backend Dependencies
        working-directory: supermarket-inventory/server
        run: npm ci

      - name: Validate Backend Syntax
        working-directory: supermarket-inventory/server
        run: node --check src/index.js

  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest

    needs:
      - frontend-build
      - backend-check

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deployment
        run: |
          curl --fail --show-error --silent \
          --request POST \
          "${{ secrets.RENDER_DEPLOY_HOOK }}"
