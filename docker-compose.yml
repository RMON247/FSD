services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7-jammy
    container_name: stockyard-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: stockyard
    volumes:
      - mongo_data:/data/db
    networks:
      - stockyard-network

  # Backend REST & WebSocket API Service
  backend:
    build:
      context: ./supermarket-inventory/server
      dockerfile: Dockerfile
    container_name: stockyard-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/stockyard
      JWT_SECRET: devops-docker-production-super-secure-secret-key-2026
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:80,http://localhost:5173,http://localhost:3000,http://127.0.0.1:80
      RATE_LIMIT_MAX: 2000
    depends_on:
      - mongodb
    networks:
      - stockyard-network

  # Frontend React SPA Service (Nginx)
  frontend:
    build:
      context: ./supermarket-inventory
      dockerfile: Dockerfile
    container_name: stockyard-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - stockyard-network

volumes:
  mongo_data:
    driver: local

networks:
  stockyard-network:
    driver: bridge
